plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.2'
}

group = project.mod_group
version = project.mod_version

base {
    archivesName = project.mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
}

repositories {
    mavenCentral()
    maven {
        name 'CleanroomMC'
        url 'https://maven.cleanroommc.com'
    }
    exclusiveContent {
        forRepository {
            maven {
                name 'CurseMaven'
                url 'https://cursemaven.com'
            }
        }
        filter {
            includeGroup 'curse.maven'
        }
    }
    flatDir {
        dirs 'libs'
    }
}

sourceSets {
    main {
        java.srcDirs = ['src/ae2s/java']
        resources.srcDirs = ['src/ae2s/resources']
    }
}

def ae2sDependencyJar = {
    def devJar = file("libs/AppliedEnergistics2-Supergiant-${project.ae2s_version}-dev.jar")
    if (devJar.exists()) {
        return devJar
    }

    def runtimeJar = file("libs/AppliedEnergistics2-Supergiant-${project.ae2s_version}.jar")
    if (runtimeJar.exists()) {
        return runtimeJar
    }

    throw new GradleException("Missing AE2S dependency jar. Expected ${devJar} or ${runtimeJar}.")
}()

minecraft {
    mcVersion.set(project.minecraft_version)
    mcpMappingChannel.set(project.mapping_channel)
    mcpMappingVersion.set(project.mapping_version)
    useDependencyAccessTransformers.set(false)
    username.set('Developer')
}

dependencies {
    compileOnly files(ae2sDependencyJar)
    runtimeOnly files(ae2sDependencyJar)

    compileOnly "curse.maven:extended-crafting-268387:${project.extended_crafting_file_id}"
    runtimeOnly "curse.maven:extended-crafting-268387:${project.extended_crafting_file_id}"

    compileOnly 'org.jetbrains:annotations:24.1.0'
}

processResources {
    includeEmptyDirs = false
    filteringCharset = 'UTF-8'
    inputs.property 'mod_id', project.mod_id
    inputs.property 'mod_name', project.mod_name
    inputs.property 'mod_version', project.mod_version
    inputs.property 'mod_description', project.mod_description
    inputs.property 'minecraft_version', project.minecraft_version

    filesMatching(['mcmod.info', 'pack.mcmeta']) {
        expand(
                mod_id: project.mod_id,
                mod_name: project.mod_name,
                mod_version: project.mod_version,
                mod_description: project.mod_description,
                minecraft_version: project.minecraft_version
        )
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : project.mod_name,
                'Specification-Vendor'  : 'WuXiaoYa',
                'Implementation-Title'  : project.mod_id,
                'Implementation-Version': project.version,
                'Implementation-Vendor' : 'WuXiaoYa'
        ])
    }
}

tasks.named('jar') {
    finalizedBy(tasks.named('reobfJar'), tasks.named('sourcesJar'))
}
