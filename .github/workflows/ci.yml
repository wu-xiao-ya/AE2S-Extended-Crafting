name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build jar
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Download AE2S dependency
        shell: bash
        run: |
          set -euo pipefail
          ae2s_version="$(grep '^ae2s_version=' gradle.properties | cut -d= -f2)"
          mkdir -p libs
          dependency="libs/AppliedEnergistics2-Supergiant-${ae2s_version}-dev.jar"
          curl -fL --retry 3 \
            "https://github.com/FormlessDragon/Applied-Energistics-2-Supergiant/releases/download/v${ae2s_version}/AppliedEnergistics2-Supergiant-${ae2s_version}-dev.jar" \
            -o "$dependency"
          echo "71e1bc6873840bf94b792ee6bbfc1d0ccdc41d734d2e134d9707955778970524  $dependency" | sha256sum --check

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build
        run: gradle --no-daemon --stacktrace clean build

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: ae2s-extended-crafting
          path: build/libs/*.jar
          if-no-files-found: error
