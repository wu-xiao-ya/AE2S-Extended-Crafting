name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build jar
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Download AE2S dependency
        shell: bash
        run: |
          set -euo pipefail
          ae2s_version="$(grep '^ae2s_version=' gradle.properties | cut -d= -f2)"
          mkdir -p libs
          curl -fL \
            "https://github.com/FormlessDragon/Applied-Energistics-2-Supergiant/releases/download/dev/AppliedEnergistics2-Supergiant-1.0.10%2B29995921c.jar" \
            -o "libs/AppliedEnergistics2-Supergiant-${ae2s_version}.jar"

      # GitHub-hosted Ubuntu runners already include Gradle 9.6.1.
      - name: Build
        run: gradle --no-daemon --stacktrace clean jar
